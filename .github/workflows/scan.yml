name: daily-gcc-job-scan
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scan
        run: python main.py
      - name: Save results
        run: |
          git config user.name "jobscan-bot"
          git config user.email "jobscan-bot@users.noreply.github.com"
          git add results state
          git commit -m "scan $(date -u +%F)" || echo "nothing to commit"
          git push
